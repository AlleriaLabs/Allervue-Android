name: Build libmpv native libraries
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-libmpv-native.yml"
permissions:
  contents: read
jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned mpv-android source
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          ref: master
          path: mpv-android
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint build-essential cmake git libtool pkg-config python3 python3-pip yasm nasm meson ninja-build
      - name: Download Android SDK, NDK and source dependencies
        working-directory: mpv-android/buildscripts
        run: ./download.sh
      - name: Build arm64 native components
        working-directory: mpv-android/buildscripts
        run: ./buildall.sh --arch arm64
      - name: Verify native outputs
        working-directory: mpv-android
        run: |
          test -d app/src/main/libs
          find app/src/main/libs -type f -name '*.so' -print
          test -n "$(find app/src/main/libs -type f -name '*.so' -print -quit)"
      - name: Upload arm64 native library bundle
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-native-arm64
          path: mpv-android/app/src/main/libs/
          if-no-files-found: error
          retention-days: 14
