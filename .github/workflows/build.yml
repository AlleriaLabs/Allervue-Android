name: Allervue Phase 2 APK

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (Whisper native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"
          echo "Installed CMake:"
          ls -la "$ANDROID_HOME/cmake/3.22.1/bin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android native toolchain
        run: |
          test -x "$ANDROID_HOME/ndk/27.2.12479018/ndk-build"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" --version

      - name: Build Allervue debug APK
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Allervue APK
        uses: actions/upload-artifact@v4
        with:
          name: Allervue-Phase2-Whisper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
