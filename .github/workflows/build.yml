name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1). Leave empty to only build."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Allervue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Allervue-apk
          path: Allervue.apk
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          cat > notes.md <<'NOTES'
          First release of the Allervue Android app.

          - Organized home discovery with a retained auto-rotating hero carousel
          - Custom ExoPlayer: gesture controls, episode navigation, intro skipping when markers are available, PiP and resume sync
          - Movie genre filters, Anime / TV Series categories, and player quality/audio settings
          - Editable server URL in Settings

          Install: download Allervue.apk on your Android phone and allow "Install unknown apps".
          NOTES
          gh release create "$TAG" Allervue.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Allervue $TAG" --notes-file notes.md
