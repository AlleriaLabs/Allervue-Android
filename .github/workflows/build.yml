name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.1). Leave empty to only build."
        required: false
        default: ""
concurrency:
  group: allervue-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ALLERVUE_KEYSTORE_BASE64 != '' && secrets.ALLERVUE_STORE_PASSWORD != '' && secrets.ALLERVUE_KEY_ALIAS != '' && secrets.ALLERVUE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream mpv-android native source
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          ref: master
          path: mpv-android
      - name: Match libmpv FFmpeg ABI with FFmpegKit
        working-directory: mpv-android/buildscripts
        run: |
          # FFmpegKit 8.1.9 is built from FFmpeg n8.1.2 (libavutil ABI 60).
          # Keep libmpv on the same FFmpeg release to prevent SONAME collisions
          # between incompatible libav* libraries in the Android process.
          sed -i 's/^v_ci_ffmpeg=.*/v_ci_ffmpeg=n8.1.2/' include/depinfo.sh
          grep -qx 'v_ci_ffmpeg=n8.1.2' include/depinfo.sh
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install libmpv native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint build-essential cmake git libtool pkg-config python3 python3-pip yasm nasm meson ninja-build gperf unzip wget
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install --upgrade 'meson>=1.11.0'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
      - name: Enable H.264 MediaCodec encoder in bundled FFmpeg
        working-directory: mpv-android/buildscripts
        run: |
          # Upstream mpv-android intentionally disables every encoder except
          # MJPEG and PNG. Allervue's local optimizer needs FFmpeg's Android
          # MediaCodec H.264 encoder, so explicitly enable it in the shared
          # libavcodec build packaged with the app.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ffmpeg.sh")
          source = path.read_text()
          old = "--enable-encoder=mjpeg,png"
          new = "--enable-encoder=mjpeg,png,h264_mediacodec"
          if source.count(old) != 1:
              raise SystemExit("Could not find the expected FFmpeg encoder allowlist")
          path.write_text(source.replace(old, new, 1))
          PY
          grep -F -- '--enable-encoder=mjpeg,png,h264_mediacodec' scripts/ffmpeg.sh
      - name: Build upstream libmpv for Android ARM64
        working-directory: mpv-android/buildscripts
        env:
          IN_CI: "1"
          DONT_BUILD_RELEASE: "1"
        run: |
          ./download.sh

          # FFmpegKit's Android AAR uses a custom SAF protocol bridge. Its JNI
          # library calls av_set_saf_open/close in libavutil, and libavformat
          # registers the matching "saf:" protocol. Reapply the same upstream
          # FFmpegKit protocol patch to the FFmpeg source used by libmpv so the
          # single packaged libav* set satisfies both native engines.
          FFMPEG_SRC="$PWD/deps/ffmpeg"
          SAF_PATCH_BASE="https://raw.githubusercontent.com/ffmpegkit-maintained/ffmpeg/c72e151c1ba5bd6ce602a1dfd5eae402095bae86/android-8.1-lts/tools/protocols"
          mkdir -p "$RUNNER_TEMP/ffmpegkit-saf"
          curl -fsSL "$SAF_PATCH_BASE/libavutil_file.h" -o "$RUNNER_TEMP/ffmpegkit-saf/libavutil_file.h"
          curl -fsSL "$SAF_PATCH_BASE/libavutil_file.c" -o "$RUNNER_TEMP/ffmpegkit-saf/libavutil_file.c"
          curl -fsSL "$SAF_PATCH_BASE/libavformat_file.c" -o "$RUNNER_TEMP/ffmpegkit-saf/libavformat_file.c"
          ! grep -q 'av_set_saf_open' "$FFMPEG_SRC/libavutil/file.c"
          ! grep -q 'ff_saf_protocol' "$FFMPEG_SRC/libavformat/protocols.c"
          cat "$RUNNER_TEMP/ffmpegkit-saf/libavutil_file.h" >> "$FFMPEG_SRC/libavutil/file.h"
          cat "$RUNNER_TEMP/ffmpegkit-saf/libavutil_file.c" >> "$FFMPEG_SRC/libavutil/file.c"
          cat "$RUNNER_TEMP/ffmpegkit-saf/libavformat_file.c" >> "$FFMPEG_SRC/libavformat/file.c"
          python3 - "$FFMPEG_SRC/libavformat/protocols.c" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          anchor = "extern const URLProtocol ff_file_protocol;"
          if source.count(anchor) != 1:
              raise SystemExit("Expected exactly one ff_file_protocol registration anchor")
          path.write_text(source.replace(
              anchor,
              anchor + "\nextern const URLProtocol ff_saf_protocol;",
              1,
          ))
          PY

          grep -q 'av_set_saf_open' "$FFMPEG_SRC/libavutil/file.c"
          grep -q 'av_get_saf_open' "$FFMPEG_SRC/libavformat/file.c"
          grep -q 'ff_saf_protocol' "$FFMPEG_SRC/libavformat/protocols.c"
          ./buildall.sh --arch arm64 mpv-android
      - name: Install libmpv runtime into Allervue
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp mpv-android/app/src/main/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          test -f app/src/main/jniLibs/arm64-v8a/libmpv.so
          test -f app/src/main/jniLibs/arm64-v8a/libplayer.so
          ls -lh app/src/main/jniLibs/arm64-v8a/
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Configure permanent release signing
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ALLERVUE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLERVUE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALLERVUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALLERVUE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/allervue-release.p12"
          {
            echo "ALLERVUE_KEYSTORE_PATH=$RUNNER_TEMP/allervue-release.p12"
            echo "ALLERVUE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ALLERVUE_KEY_ALIAS=$KEY_ALIAS"
            echo "ALLERVUE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify packaged FFmpeg ABI compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-abi-check"
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libavutil.so > "$RUNNER_TEMP/ffmpeg-abi-check/libavutil.so"
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libavformat.so > "$RUNNER_TEMP/ffmpeg-abi-check/libavformat.so"
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libffmpegkit.so > "$RUNNER_TEMP/ffmpeg-abi-check/libffmpegkit.so"
          # FFmpeg version ABI must match.
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libavutil.so" | grep -E 'av_log_default_callback@@LIBAVUTIL_60([[:space:]]|$)'
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libffmpegkit.so" | grep -E 'av_log_default_callback@LIBAVUTIL_60([[:space:]]|$)'
          # FFmpegKit's custom SAF hooks must exist in the one packaged libavutil.
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libavutil.so" | grep -E 'av_set_saf_open@@LIBAVUTIL_60([[:space:]]|$)'
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libavutil.so" | grep -E 'av_set_saf_close@@LIBAVUTIL_60([[:space:]]|$)'
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libffmpegkit.so" | grep -E 'av_set_saf_open@LIBAVUTIL_60([[:space:]]|$)'
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libffmpegkit.so" | grep -E 'av_set_saf_close@LIBAVUTIL_60([[:space:]]|$)'
          # libavformat must consume the same hooks and register the saf: protocol.
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libavformat.so" | grep -E 'av_get_saf_open@LIBAVUTIL_60([[:space:]]|$)'
          readelf -Ws "$RUNNER_TEMP/ffmpeg-abi-check/libavformat.so" | grep -E 'av_get_saf_close@LIBAVUTIL_60([[:space:]]|$)'
          strings -n 3 "$RUNNER_TEMP/ffmpeg-abi-check/libavformat.so" | grep -qx 'saf'
      - name: Build permanently signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: |
          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk Allervue.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk Allervue.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Allervue-apk
          path: Allervue.apk
      - name: Publish GitHub Release
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v'))) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Allervue Android release.

          - In-app GitHub release update notifications
          - Updates install over the existing app when signed with the permanent Allervue release key
          - Player, Jellyfin library, and playback features
          
          Install: download Allervue.apk and allow "Install unknown apps" when Android asks.
          NOTES
          gh release create "$TAG" Allervue.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Allervue $TAG" --notes-file notes.md
      - name: Explain why release signing is unavailable
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        run: echo "::warning::Permanent signing secrets are not configured. Only an unsigned-key debug build artifact is produced; no update release is published."
